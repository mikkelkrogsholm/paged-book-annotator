name: paged-book-annotator-example

services:
  book-viewer:
    build:
      context: .
    image: paged-book-annotator:dev
    init: true
    ports:
      - "127.0.0.1:${PORT:-4174}:4173"
    volumes:
      - ./example/book:/book:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
