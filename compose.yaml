name: paged-book-annotator-example

services:
  book-viewer:
    build:
      context: .
    image: paged-book-annotator:dev
    init: true
    environment:
      PBA_ADMIN_EMAIL: ${PBA_ADMIN_EMAIL:-}
      PBA_ADMIN_NAME: ${PBA_ADMIN_NAME:-Administrator}
      PBA_ADMIN_PASSWORD: ${PBA_ADMIN_PASSWORD:-}
      PBA_LOG_LEVEL: ${PBA_LOG_LEVEL:-info}
      PBA_LOG_FORMAT: ${PBA_LOG_FORMAT:-json}
      PBA_DATA_DIR: /data
      # Containeren binder internt på 0.0.0.0; porten ovenfor publiceres kun på host-loopback.
      PBA_ALLOW_NON_LOOPBACK_LOCAL_BYPASS: "1"
    ports:
      - "127.0.0.1:${PORT:-4174}:4173"
    volumes:
      - pba-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pba-data:
